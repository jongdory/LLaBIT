model:
  base_learning_rate: 4.5e-06
  target: taming.models.vqgan2.VQModel2
  params:
    embed_dim: 256
    n_embed: 1024
    ckpt_path: ../ckpts/vqgan_brats/vqgan_brats_f16_stage2.ckpt 
    ddconfig:
      double_z: false
      z_channels: 256
      resolution: 192
      in_channels: 3
      out_ch: 3
      ch: 128
      ch_mult:
      - 1
      - 1
      - 2
      - 2
      - 4
      num_res_blocks: 2
      attn_resolutions:
      - 16
      dropout: 0.0
      num_head_channels: 64
      context_dim: 1024
      use_checkpoint: true
      attn_res:
      - 16
      - 8
      - 4
      zero_init: true
      cond_stage_config:
        target: taming.models.modules.FrozenOpenCLIPEmbedder
        params:
          freeze: true
          version: laion2b_s32b_b79k
          layer: penultimate
          targets:
          - t1
          - t1ce
          - t2
          - flair
          - pd
          - edema
          - hyperintensity
          - enhancing_tumor
          - tumor_core
          - stroke
    lossconfig:
      target: taming.modules.losses.vqperceptual.VQLPIPSWithDiscriminator
      params:
        disc_conditional: false
        disc_in_channels: 3
        disc_start: 100000
        disc_weight: 0.8
        codebook_weight: 1.0
data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 32
    num_workers: 12
    train:
      target: taming.data.custom.VQBrains2_tr
    validation:
      target: taming.data.custom.VQBrains2_tr
      mode: test
data2:
  target: main.DataModuleFromConfig
  params:
    batch_size: 32
    num_workers: 12
    train:
      target: taming.data.custom.VQBrains2_seg
    validation:
      target: taming.data.custom.VQBrains2_seg
      mode: test
